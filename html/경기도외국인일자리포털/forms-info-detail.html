  <script src="./js/외국인일자리.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const detailData = {
        'multilingual': {
          type: 'multilingual',
          title: '다국어 통역지원',
          sub: '외국인 근로자 및 구직자를 위한 통역 지원 서비스'
        },
        'visa-e9': {
          type: 'visa',
          title: 'E-9 비자',
          sub: '비전문취업 비자 관련 안내',
          desc: '해당 비자는 국내 체류 외국인을 위한 제도로서, 요건을 충족하는 대상자에게 발급됩니다. 자세한 자격 요건과 제출 서류는 관할 출입국·외국인청 또는 하이코리아(Hi Korea) 홈페이지를 통해 확인하시기 바랍니다.'
        },
        'visa-e7': {
          type: 'visa',
          title: 'E-7 비자',
          sub: '특정활동 비자 관련 안내',
          desc: '해당 비자는 대한민국 내의 공·사기관과의 계약에 따라 지정된 활동에 종사하려는 외국인 전문인력을 위한 비자입니다.'
        },
        'visa-f2': {
          type: 'visa',
          title: 'F-2 비자',
          sub: '거주 비자 관련 안내',
          desc: '해당 비자는 장기 체류 및 자유로운 취업 활동이 가능한 거주 자격 비자입니다.'
        },
        'visa-f4': {
          type: 'visa',
          title: 'F-4 비자',
          sub: '재외동포 비자 관련 안내',
          desc: '해당 비자는 대한민국 국적을 보유하였던 사람 또는 직계비속으로서 외국국적을 취득한 재외동포를 위한 비자입니다.'
        },
        'visa-f6': {
          type: 'visa',
          title: 'F-6 비자',
          sub: '결혼이민 비자 관련 안내',
          desc: '해당 비자는 국민의 배우자로서 대한민국에 체류하려는 외국인을 위한 체류 자격 비자입니다.'
        },
        'visa-f10': {
          type: 'visa',
          title: 'F-10 비자',
          sub: '우수인재 비자 관련 안내',
          desc: '해당 비자는 우수 인재 자격을 갖춘 외국인을 위한 비자 안내 항목입니다.'
        }
      };

      const urlParams = new URLSearchParams(window.location.search);
      const contentId = urlParams.get('id') || 'visa-e9';
      const item = detailData[contentId] || detailData['visa-e9'];

      document.getElementById('hero-title').textContent = item.title;
      document.getElementById('hero-sub').textContent = item.sub;
      document.getElementById('page-title').textContent = `경기도외국인일자리포털 - ${item.title}`;

      const container = document.getElementById('detail-dynamic-content');

      if (item.type === 'multilingual') {
        container.innerHTML = `
          <div class="lang-support-top">
            <div class="center-call-card">
              <div class="ico-circle blue">
                <i data-lucide="phone"></i>
              </div>
              <h3 class="center-name">외국인종합안내센터</h3>
              <div class="phone-num">
                <i data-lucide="phone-call"></i>
                <span>1345</span>
              </div>
              <p class="phone-sub">(국번 없이)</p>
            </div>

            <div class="center-info-right">
              <div class="info-block">
                <div class="block-tit">
                  <i data-lucide="clock"></i>
                  <span>운영시간</span>
                </div>
                <div class="block-box">
                  <p class="main-time">평일 <strong>09:00~22:00</strong></p>
                  <p class="sub-time">※ 18시 이후에는 한국어·영어·중국어 상담 운영</p>
                </div>
              </div>

              <div class="info-block">
                <div class="block-tit">
                  <i data-lucide="globe"></i>
                  <span>지원 언어 (총 20개 언어)</span>
                </div>
                <div class="block-box">
                  <p class="lang-list-text">
                    한국어, 영어, 중국어, 베트남어, 태국어, 일본어, 몽골어, 인도네시아어, 프랑스어, 러시아어, 네팔어, 캄보디아어, 미얀마어, 독일어, 스페인어, 필리핀어, 아랍어, 스리랑카어 등
                  </p>
                </div>
              </div>
            </div>
          </div>

          <div class="provided-services-sec">
            <h3 class="sec-title">제공 서비스</h3>
            <div class="services-grid-2">
              <div class="service-card">
                <i data-lucide="check-circle-2"></i>
                <span>출입국·비자 관련 상담</span>
              </div>
              <div class="service-card">
                <i data-lucide="check-circle-2"></i>
                <span>생활정보 안내</span>
              </div>
              <div class="service-card">
                <i data-lucide="check-circle-2"></i>
                <span>공공기관 이용 시 3자 전화통역</span>
              </div>
              <div class="service-card">
                <i data-lucide="check-circle-2"></i>
                <span>법률상담(마을변호사) 통역 지원</span>
              </div>
              <div class="service-card">
                <i data-lucide="check-circle-2"></i>
                <span>공공기관과 외국인 간 통역 지원</span>
              </div>
            </div>
          </div>

          <div class="red-alert-callout">
            <i data-lucide="alert-circle"></i>
            <span>응급실 의료진이 1345에 연결하면 <strong>3자 통역(의료진-통역사-환자)</strong>을 받을 수 있습니다.</span>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="visa-section-block">
            <div class="visa-block-tit">
              <i data-lucide="check-circle-2" class="ico-orange"></i>
              <span>비자 개요</span>
            </div>
            <div class="visa-gray-box">
              <p>${item.desc}</p>
            </div>
          </div>

          <div class="visa-section-block">
            <div class="visa-block-tit">
              <i data-lucide="alert-circle" class="ico-blue"></i>
              <span>주요 안내사항</span>
            </div>
            <div class="visa-notice-cards">
              <div class="v-card">
                <span class="num-badge">1</span>
                <span>비자 신청 및 연장은 체류 기간 만료 전에 완료해야 합니다.</span>
              </div>
              <div class="v-card">
                <span class="num-badge">2</span>
                <span>취업 활동을 하려는 경우, 비자 종류에 따라 별도의 허가나 신고가 필요할 수 있습니다.</span>
              </div>
              <div class="v-card">
                <span class="num-badge">3</span>
                <span>체류지 변경 시 14일 이내에 관할 기관에 전입신고를 해야 합니다.</span>
              </div>
            </div>
          </div>
        `;
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
